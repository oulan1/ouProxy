<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ouProxy</title>
    <style>
        :root {
            --purple: #a855f7;
            --green: #4ade80;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #050505, #1a0b2e, #2d0a4e, #0a0a0a, #3b0764);
            background-size: 400% 400%;
            animation: moveGradient 8s ease infinite;
            color: white;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-section {
            padding-top: 20px;
            padding-bottom: 20px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
            letter-spacing: 1px;
            text-transform: lowercase;
        }

        .content-area {
            width: 100%;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 10px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            transition: transform 0.4s cubic-bezier(0.4, 0.0, 0.2, 1), opacity 0.4s ease;
            opacity: 0;
            transform: translateX(50px);
            pointer-events: none;
        }

        .page.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: all;
            z-index: 10;
        }

        .page.slide-left { transform: translateX(-50px); opacity: 0; }
        .page.slide-right { transform: translateX(50px); opacity: 0; }

        .scroll-grid {
            overflow-y: auto;
            padding-bottom: 80px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            align-content: start;
            scrollbar-width: none; 
        }
        .scroll-grid::-webkit-scrollbar { display: none; }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 10px 8px 10px;
        }

        .server-name { font-size: 15px; font-weight: 600; }
        .server-name a { color: var(--purple); text-decoration: none; }

        .signal-bars { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
        .bar { width: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); }
        .bar:nth-child(1) { height: 25%; }
        .bar:nth-child(2) { height: 45%; }
        .bar:nth-child(3) { height: 65%; }
        .bar:nth-child(4) { height: 85%; }
        .bar:nth-child(5) { height: 100%; }

        .c-purple .active { background: var(--purple); box-shadow: 0 0 8px var(--purple); }
        .c-green .active { background: var(--green); box-shadow: 0 0 8px var(--green); }

        .btn-glass {
            width: 100%;
            padding: 20px;
            border-radius: 24px;
            border: none;
            color: white;
            font-size: 17px;
            font-weight: 800;
            text-decoration: none;
            display: block;
            position: relative;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.08);
        }

        .btn-glass:hover {
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 15px 35px rgba(168, 85, 247, 0.25), inset 0 3px 6px rgba(255,255,255,0.4);
        }
        
        .btn-glass:active { transform: scale(0.96); }

        .grid-item-btn {
            padding: 25px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            min-height: 110px;
        }

        .back-container { width: 100%; margin-bottom: 5px; flex-shrink: 0; }
        .btn-back { background: rgba(255, 255, 255, 0.05); font-size: 14px; padding: 12px; }

    </style>
</head>
<body oncontextmenu="return false;">

    <div class="app-container">

            </svg>
            <div class="subtitle">поможет даже при блокировке</div>

        <div class="content-area">
            
            <div id="page-main" class="page active">

    <script>
        const proxiesData = [
            { id: 1, url: "tg://proxy?server=14.102.10.36&port=888&secret=eeNEgYdJvXrFGRMCIMJdCQ" },

            { id: 7, url: "https://t.me/proxy?server=108.181.123.105&port=9443&secret=eeNEgYdJvXrFGRMCIMJdCQ" },
            { id: 8, url: "https://t.me/proxy?server=14.102.10.55&port=8443&secret=EERighJJvXrFGRMCIMJdCQRueWVrdGFuZXQuY29tZmFyYWthdi5jb212YW4ubmFqdmEuY29tAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }
        ];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            const shuffled = shuffleArray([...proxiesData]);
            shuffled.forEach(item => {
                const link = document.createElement('a');
                link.href = item.url;
                link.className = 'btn-glass grid-item-btn';
                link.innerHTML = `<div>Proxy</div><div style="font-size: 24px; color: var(--purple); margin-top: 5px;">#${item.id}</div>`;
                container.appendChild(link);
            });
        }

        function goToExtra() {
            renderGrid(); // Перемешиваем КАЖДЫЙ РАЗ при нажатии на кнопку
            const pMain = document.getElementById('page-main');
            const pList = document.getElementById('page-list');
            pMain.classList.remove('active');
            pMain.classList.add('slide-left');
            pList.classList.remove('slide-right');
            pList.classList.add('active');
        }

        function goToMain() {
            const pMain = document.getElementById('page-main');
            const pList = document.getElementById('page-list');
            pList.classList.remove('active');
            pList.classList.add('slide-right');
            pMain.classList.remove('slide-left');
            pMain.classList.add('active');
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 'i' || e.key === 's')) e.preventDefault();
        });
    </script>
</body>
</html>

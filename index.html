<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ouProxy</title>
    <style>
        :root {
            --purple: #a855f7;
            --green: #4ade80;
            --yellow: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Поднимаем контент выше */
            color: white;
            /* Динамичный градиент */
            background: linear-gradient(135deg, #050505, #1a0b2e, #2d0a4e, #0a0a0a, #3b0764);
            background-size: 400% 400%;
            animation: moveGradient 8s ease infinite;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        /* Логотип */
        .logo-box {
            margin-top: 10px; /* Выше к краю */
            margin-bottom: 40px;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
            letter-spacing: 1px;
            text-transform: lowercase;
        }

        /* Список серверов */
        .proxy-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 10px 10px 10px;
        }

        .server-name {
            font-size: 15px;
            font-weight: 600;
        }

        .server-name a {
            color: var(--purple);
            text-decoration: none;
        }

        /* Пинг и Полоски */
        .status-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .signal-bars {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 16px;
        }

        .bar {
            width: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
        }

        .bar:nth-child(1) { height: 25%; }
        .bar:nth-child(2) { height: 45%; }
        .bar:nth-child(3) { height: 65%; }
        .bar:nth-child(4) { height: 85%; }
        .bar:nth-child(5) { height: 100%; }

        /* Цвета */
        .c-purple { color: var(--purple); }
        .c-purple .active { background: var(--purple); box-shadow: 0 0 10px var(--purple); }
        
        .c-green { color: var(--green); }
        .c-green .active { background: var(--green); box-shadow: 0 0 10px var(--green); }
        
        .c-yellow { color: var(--yellow); }
        .c-yellow .active { background: var(--yellow); box-shadow: 0 0 10px var(--yellow); }

        .note {
            font-size: 11px;
            color: #777;
            margin-top: 3px;
        }

        /* Кнопка Жидкое Стекло (Объемная) */
        .btn-glass {
            width: 100%;
            padding: 20px;
            border-radius: 24px;
            border: none;
            color: white;
            font-size: 17px;
            font-weight: 800;
            text-decoration: none;
            display: block;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            
            /* Фон - имитация толщи стекла */
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            /* Сложные тени для объема */
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.5),
                inset 0 4px 4px rgba(255,255,255,0.3),    /* Верхний блик */
                inset 0 -4px 6px rgba(0,0,0,0.4),        /* Нижняя тень внутри */
                inset 4px 0 6px rgba(255,255,255,0.1),   /* Боковой блик */
                0 0 0 1px rgba(255,255,255,0.1);         /* Тонкий контур */
        }

        .btn-glass:hover {
            transform: scale(1.03) translateY(-5px);
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.1) 100%);
            box-shadow: 
                0 20px 45px rgba(168, 85, 247, 0.3),
                inset 0 4px 8px rgba(255,255,255,0.5),
                0 0 0 1px rgba(255,255,255,0.2);
        }

        .btn-glass:active {
            transform: scale(0.98);
        }

        /* Эффект блика */
        .btn-glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-25deg);
            transition: 0.8s;
        }

        .btn-glass:hover::before {
            left: 150%;
        }

    </style>
</head>
